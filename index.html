<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方块放置游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <button class="nav-btn active" data-page="board">底板</button>
            <button class="nav-btn" data-page="gacha">获取方块</button>
            <button class="nav-btn" data-page="upgrade">升级方块</button>
            <button class="nav-btn" data-page="config">数据配置</button>
        </nav>

        <!-- 底板页面 -->
        <div id="board-page" class="page active">
            <div class="board-container">
                <div class="board-wrapper">
                    <div id="game-board" class="game-board"></div>
                    <div class="board-info">
                        <div class="scheme-selector">
                            <label>当前方案：</label>
                            <select id="scheme-select" class="scheme-select"></select>
                        </div>
                        <h3>属性总值</h3>
                        <div id="attribute-display" class="attribute-display"></div>
                        <div id="board-active-days-display" class="active-days-info-board">活跃天数: 第 1 天</div>
                        <div id="silver-keys-display" class="keys-display">银色钥匙: 0</div>
                        <div id="gold-keys-display" class="keys-display gold-keys">金色钥匙: 0</div>
                        <button id="clear-board-btn" class="clear-board-btn">清空当前方案</button>
                        <button id="reset-system-btn" class="reset-system-btn">重置系统</button>
                    </div>
                </div>
                <div class="inventory-section">
                    <h3>我的方块</h3>
                    <div id="inventory" class="inventory"></div>
                </div>
            </div>
        </div>

        <!-- 获取方块页面 -->
        <div id="gacha-page" class="page">
            <div class="gacha-container">
                <h2>获取方块</h2>
                <div class="gacha-boxes">
                    <div class="gacha-box">
                        <h3>低级宝箱</h3>
                        <p>可获得1-3级方块</p>
                        <div id="gacha-silver-keys-display" class="keys-display">银色钥匙: 0</div>
                        <div class="gacha-buttons">
                            <button class="gacha-btn" data-type="low" data-count="1">开1次 (消耗1把钥匙)</button>
                            <button class="gacha-btn" data-type="low" data-count="10">开10次 (消耗10把钥匙)</button>
                        </div>
                    </div>
                    <div class="gacha-box">
                        <h3>高级宝箱</h3>
                        <p>可获得2-5级方块和特殊方块</p>
                        <div id="gacha-gold-keys-display" class="keys-display gold-keys">金色钥匙: 0</div>
                        <div class="gacha-buttons">
                            <button class="gacha-btn" data-type="high" data-count="1">开1次 (消耗1把钥匙)</button>
                            <button class="gacha-btn" data-type="high" data-count="10">开10次 (消耗10把钥匙)</button>
                        </div>
                    </div>
                </div>
                <div id="active-days-display" class="active-days-section"></div>
                <div id="gacha-results" class="gacha-results"></div>
            </div>
        </div>

        <!-- 升级方块页面 -->
        <div id="upgrade-page" class="page">
            <div class="upgrade-container">
                <h2>升级方块</h2>
                <div class="upgrade-controls">
                    <button id="auto-merge-btn" class="auto-merge-btn">一键合成</button>
                    <select id="merge-level-select"></select>
                    <button id="manual-merge-btn" class="manual-merge-btn" style="display: none;">合成选中方块 (0/4)</button>
                    <button id="clear-selection-btn" class="clear-selection-btn" style="display: none;">清除选择</button>
                </div>
                <div id="upgrade-inventory" class="upgrade-inventory"></div>
            </div>
        </div>

        <!-- 数据配置页面 -->
        <div id="config-page" class="page">
            <div class="config-page-container">
                <h2>数据配置</h2>
                <div class="config-tabs">
                    <button class="tab-btn active" data-tab="table1">属性等级表</button>
                    <button class="tab-btn" data-tab="table2">特殊方块区域</button>
                    <button class="tab-btn" data-tab="table3">宝箱概率表</button>
                    <button class="tab-btn" data-tab="table4">二级属性配置</button>
                    <button class="tab-btn" data-tab="table5">特殊方块加成</button>
                    <button class="tab-btn" data-tab="table6">底板扩展规则</button>
                    <button class="tab-btn" data-tab="table7">全满加成</button>
                    <button class="tab-btn" data-tab="table8">角色配置</button>
                    <button class="tab-btn" data-tab="table9">方案数量</button>
                </div>
                <div id="config-page-content" class="config-page-content"></div>
                <div class="config-actions">
                    <button id="save-config-btn" class="save-config-btn">保存配置</button>
                    <button id="save-as-default-btn" class="save-as-default-btn">保存为默认配置</button>
                    <button id="reset-config-btn" class="reset-config-btn">重置为默认</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 数据配置弹窗 -->
    <div id="config-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>游戏配置</h2>
            <div class="config-tabs">
                <button class="tab-btn active" data-tab="table1">属性等级表</button>
                <button class="tab-btn" data-tab="table2">特殊方块区域</button>
                <button class="tab-btn" data-tab="table3">宝箱概率表</button>
            </div>
            <div id="config-content" class="config-content"></div>
        </div>
    </div>

    <!-- 版本号显示 -->
    <div class="version-info">
        <span id="version-display">版本号: 1.1.92</span>
    </div>

    <script src="data.js"></script>
    <script src="game.js"></script>
    <script src="app.js"></script>
</body>
</html>
